<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talking Detective Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Amiri:wght@700&display=swap">
<style>
:root{--bg:#07090f;--ink:#f6efe2;--gold:#e9b96a;--gold2:#ffd98f;--panel:rgba(14,18,28,.82);--line:rgba(233,185,106,.45)}
@media (prefers-color-scheme: light){:root:not([data-theme="light"]){--bg:#07090f}}
:root[data-theme="dark"]{--bg:#07090f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;overflow:hidden}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;height:100%;max-height:100dvh;aspect-ratio:688/1024;max-width:100vw;overflow:hidden;background:#000}
.cam{position:absolute;inset:0;transform-origin:50% 40%;animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1.03) translateY(0)}50%{transform:scale(1.045) translateY(-0.4%)}}
.layer{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
.base{background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_3JpJkywIRlAJNQVZ9HPVpTDZYWi/hf_20261030_183431_ee01f9d7-aed3-459c-b7f4-b262c15b708e.png")}
/* patches: full-size image layers, masked to an ellipse around the region (coords in 688x1024 space) */
.mouth{background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_3JpJkywIRlAJNQVZ9HPVpTDZYWi/hf_20261030_183512_452281c6-e207-4434-8275-fd6fefc3cf16.png");
  -webkit-mask-image:radial-gradient(ellipse 15.1% 8.6% at 51.2% 45.3%,#000 55%,transparent 100%);
          mask-image:radial-gradient(ellipse 15.1% 8.6% at 51.2% 45.3%,#000 55%,transparent 100%);opacity:0}
.eyes{background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_3JpJkywIRlAJNQVZ9HPVpTDZYWi/hf_20261030_183513_33265036-cd5a-40cf-b74b-df28afd985d0.png");
  -webkit-mask-image:radial-gradient(ellipse 16.3% 4.7% at 47.7% 28.9%,#000 55%,transparent 100%);
          mask-image:radial-gradient(ellipse 16.3% 4.7% at 47.7% 28.9%,#000 55%,transparent 100%);opacity:0}
.vignette{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.0) 50%,rgba(5,7,12,.85) 100%);pointer-events:none}
.box{position:absolute;left:4%;right:4%;bottom:3.5%;padding:16px 18px 18px;border-radius:18px;background:var(--panel);border:1.5px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04);
  transform:translateY(130%);transition:transform .55s cubic-bezier(.2,1.1,.3,1)}
.box.show{transform:none}
.name{position:absolute;top:-17px;right:18px;padding:3px 14px;border-radius:10px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1408;font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.text{font-size:clamp(17px,4.6vw,22px);line-height:1.75;font-weight:700;min-height:3.5em}
.text .c{opacity:0;transition:opacity .12s}
.text .c.on{opacity:1}
.next{position:absolute;left:16px;bottom:10px;width:12px;height:12px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg);opacity:0;animation:bob 1s ease-in-out infinite}
.done .next{opacity:1}
@keyframes bob{50%{translate:0 4px}}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(60% 50% at 50% 50%,rgba(0,0,0,.35),rgba(0,0,0,.75));cursor:pointer;z-index:5;text-align:center;padding:16px}
.start h1{font-family:"Amiri",serif;font-size:clamp(30px,8vw,44px);color:var(--gold2);text-shadow:0 4px 18px rgba(0,0,0,.6)}
.start p{opacity:.85;font-size:15px}
.play{width:78px;height:78px;border-radius:50%;background:linear-gradient(180deg,var(--gold2),var(--gold));display:grid;place-items:center;box-shadow:0 0 0 8px rgba(233,185,106,.18),0 14px 30px rgba(0,0,0,.5)}
.play::after{content:"";border-left:24px solid #1b1408;border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:6px}
.replay{position:absolute;top:14px;left:14px;z-index:4;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(10,12,18,.6);color:var(--ink);font:700 14px "Cairo";cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
.replay.on{opacity:1;pointer-events:auto}
.tag{position:absolute;top:14px;right:14px;z-index:4;padding:6px 12px;border-radius:999px;background:rgba(10,12,18,.55);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--gold2)}
</style>
</head>
<body>
<div class="wrap"><div class="stage" id="stage">
  <div class="cam" id="cam">
    <div class="layer base"></div>
    <div class="layer mouth" id="mouth"></div>
    <div class="layer eyes" id="eyes"></div>
  </div>
  <div class="vignette"></div><div class="grade"></div>
  <div class="tag">تجربة · قضية بالحروف</div>
  <button class="replay" id="replay">↻ إعادة</button>
  <div class="box" id="box"><div class="name">المفتش كريم</div><div class="text" id="text"></div><div class="next"></div></div>
  <div class="start" id="start"><h1>قضية بالحروف</h1><div class="play"></div><p>اضغط للتشغيل (شغّل الصوت)</p></div>
</div></div>
<script>
const AUDIO="https://d8j0ntlcm91z4.cloudfront.net/user_3JpJkywIRlAJNQVZ9HPVpTDZYWi/hf_20261030_183440_0e06d5ca-4245-4bc1-9e8b-cf81ea4fa975.mp3";
const LINE="وُجِدَتِ الجُثّةُ قُربَ المِيناءِ عِندَ الفَجر... ولا أحَدَ رأى شيئاً. لكِن تَذكَّر، الحُروفُ لا تَكذِب.";
const mouth=document.getElementById('mouth'),eyes=document.getElementById('eyes'),box=document.getElementById('box'),textEl=document.getElementById('text'),start=document.getElementById('start'),replay=document.getElementById('replay');
// build the line as spans (whole words keep Arabic shaping)
const words=LINE.split(' ');textEl.innerHTML=words.map(w=>'<span class="c">'+w+'</span>').join(' ');
const spans=[...textEl.querySelectorAll('.c')];
// blinking
function blink(){eyes.style.opacity=1;setTimeout(()=>eyes.style.opacity=0,130);setTimeout(blink,2200+Math.random()*3200)}
setTimeout(blink,1500);
let ctx,buf,talking=false;
async function load(){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  if(!buf){const ab=await (await fetch(AUDIO)).arrayBuffer();buf=await ctx.decodeAudioData(ab);}
}
async function play(){
  start.style.display='none';replay.classList.remove('on');box.classList.remove('done');spans.forEach(s=>s.classList.remove('on'));
  box.classList.add('show');
  try{await load();}catch(e){fallback();return}
  if(ctx.state==='suspended')await ctx.resume();
  const src=ctx.createBufferSource();src.buffer=buf;const an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.35;
  src.connect(an);an.connect(ctx.destination);
  const data=new Float32Array(an.fftSize);const t0=ctx.currentTime+.35;src.start(t0);talking=true;
  const dur=buf.duration;let lvl=0;
  // reveal words proportionally to speech, skipping silent parts
  (function loop(){
    const t=ctx.currentTime-t0;
    an.getFloatTimeDomainData(data);let s=0;for(let i=0;i<data.length;i++)s+=data[i]*data[i];const rms=Math.sqrt(s/data.length);
    const target=Math.min(1,Math.max(0,(rms-0.015)/0.09));lvl+= (target-lvl)*(target>lvl?0.55:0.35);
    mouth.style.opacity=lvl>0.08?Math.min(1,lvl*1.2).toFixed(2):0;
    const n=Math.min(spans.length,Math.ceil((t/(dur*0.92))*spans.length));for(let i=0;i<n;i++)spans[i].classList.add('on');
    if(t<dur+.1)requestAnimationFrame(loop);else{mouth.style.opacity=0;talking=false;spans.forEach(s=>s.classList.add('on'));box.classList.add('done');replay.classList.add('on');}
  })();
}
function fallback(){ // no Web Audio: plain audio + generic flaps
  const a=new Audio(AUDIO);a.play();let i=0;const iv=setInterval(()=>{mouth.style.opacity=Math.random()>.45?(.5+Math.random()*.5):0;if(i<spans.length)spans[i++].classList.add('on')},140);
  a.onended=()=>{clearInterval(iv);mouth.style.opacity=0;spans.forEach(s=>s.classList.add('on'));box.classList.add('done');replay.classList.add('on')};
}
start.onclick=play;replay.onclick=play;
</script>
</body>
</html>
